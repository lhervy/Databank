name: "D · ECB FX rates (REST API, daily, containerised job)"

# Runs the loader INSIDE the Docker image built from ingestion/Dockerfile:
# the same pinned Python and libraries as on a laptop, the key passed at run time only.
on:
  schedule:
    - cron: "30 15 * * 1-5"      # 16:30 Paris (winter): after the ECB publishes at 16:00 CET
  workflow_dispatch:
    inputs:
      start:
        description: "Force a start date (YYYY-MM-DD), empty = watermark"
        required: false

concurrency: { group: ingest-ecb, cancel-in-progress: false }

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT || 'xedwtqk-wk19730' }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER || 'SVC_DATABANK_INGEST' }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      IMAGE: databank-loader:1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the loader image
        run: docker build -f ingestion/Dockerfile -t "$IMAGE" .
      - name: Pull new rates and MERGE into RAW.ECB_FX_RATES (inside the container)
        run: >
          docker run --rm
          -e SNOWFLAKE_ACCOUNT -e SNOWFLAKE_USER -e SNOWFLAKE_PRIVATE_KEY
          -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT
          "$IMAGE"
          python -m ingestion.d_ecb_api.ingest_ecb_fx ${{ inputs.start && format('--start {0}', inputs.start) || '' }}
